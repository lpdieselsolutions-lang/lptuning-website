name: Auto-publish Blog Post

on:
  schedule:
    # Runs Monday and Thursday at 8pm AEST (10am UTC)
    - cron: '0 10 * * 1,4'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_blog.py

      - name: Commit and push
        run: |
          git config user.name "LP Tuning Bot"
          git config user.email "luukpietje@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-publish: $(cat /tmp/lp_blog_title.txt 2>/dev/null || echo 'new blog post') [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push origin HEAD:main
